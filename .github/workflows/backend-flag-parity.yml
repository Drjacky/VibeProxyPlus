name: Backend Flag Parity

# Verifies that every login flag the app sends is defined by the latest CLIProxyAPIPlus
# release (or listed as runtime-gated in scripts/check-backend-flag-parity.sh), so an
# upstream flag removal fails CI instead of shipping as a broken connect button.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flag-parity:
    name: Verify login flags against CLIProxyAPIPlus
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest CLIProxyAPIPlus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LATEST_TAG=$(gh release view --repo kaitranntt/CLIProxyAPIPlus --json tagName -q '.tagName')
          echo "Latest CLIProxyAPIPlus: $LATEST_TAG"
          RELEASE_JSON=$(gh api "repos/kaitranntt/CLIProxyAPIPlus/releases/tags/$LATEST_TAG")
          ASSET_REGEX="^CLIProxyAPIPlus_.+_darwin_(aarch64|arm64)(_no-plugin)?\\.tar\\.gz$"
          URL=$(echo "$RELEASE_JSON" | jq -r --arg regex "$ASSET_REGEX" '.assets[] | select(.name | test($regex)) | .browser_download_url' | head -n 1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Error: could not resolve a darwin arm64 asset for $LATEST_TAG" >&2
            exit 1
          fi
          curl -L -f --retry 3 --retry-delay 5 -o cliproxy.tar.gz "$URL"
          TEMP_DIR=$(mktemp -d)
          tar -xzf cliproxy.tar.gz -C "$TEMP_DIR"
          BINARY=$(find "$TEMP_DIR" -type f \( -name "CLIProxyAPIPlus" -o -name "cli-proxy-api-plus" -o -name "cli-proxy-api" \) | head -1)
          if [ -z "$BINARY" ]; then
            echo "Error: no binary found in tarball" >&2
            exit 1
          fi
          chmod +x "$BINARY"
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Check app login flags against backend
        run: |
          chmod +x scripts/check-backend-flag-parity.sh
          ./scripts/check-backend-flag-parity.sh "$BINARY"
